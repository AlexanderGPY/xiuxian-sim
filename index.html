<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云隐仙踪 · P1 荒山立足</title>
<script>
  /* 最早的错误捕获：任何脚本异常都记入 window.__errs，供排查与 __G 读取 */
  window.__errs = [];
  window.addEventListener('error', function (e) {
    __errs.push(e.message + ' @' + (e.filename || '?').split('/').pop() + ':' + e.lineno + ':' + e.colno);
  });
  window.addEventListener('unhandledrejection', function (e) { __errs.push('promise: ' + e.reason); });
</script>
<style>
  :root{
    --paper:#f4efe3; --jiao:#1f1d1a; --nong:#3a3733; --zhong:#5c5852;
    --dan:#8f8a80; --qing:#c9c4b8; --zhu:#a33b2e; --hua:#3d5a80; --zhe:#8c6a4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--paper);
    font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;color:var(--nong);
    -webkit-user-select:none;user-select:none}
  #stage{position:absolute;inset:0}

  /* ---- 顶栏 ---- */
  #topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
    padding:8px 14px;pointer-events:none;z-index:10}
  #topbar>*{pointer-events:auto}
  .seal{width:38px;height:38px;line-height:38px;text-align:center;border:3px solid var(--zhu);
    color:var(--zhu);border-radius:5px;font-size:18px;transform:rotate(-4deg);
    background:rgba(244,239,227,.88)}
  .title{font-size:20px;color:var(--jiao);letter-spacing:4px}
  .title small{font-size:11px;color:var(--dan);letter-spacing:2px;margin-left:8px}
  #res{display:flex;gap:6px;margin-left:6px}
  .chip{font-size:13px;color:var(--zhong);background:rgba(244,239,227,.88);
    border:1px solid rgba(92,88,82,.25);border-radius:3px;padding:2px 8px;letter-spacing:1px}
  .chip.bad{color:var(--zhu);border-color:var(--zhu)}
  #date{margin-left:auto;font-size:15px;color:var(--zhong);letter-spacing:2px;
    background:rgba(244,239,227,.88);padding:3px 12px;border:1px solid rgba(92,88,82,.25);border-radius:3px}
  #speed{display:flex;gap:4px;margin-left:8px}
  #speed button,#filebtns button,#filebtns select{height:30px;font-family:inherit;font-size:13px;color:var(--zhong);
    background:rgba(244,239,227,.9);border:1px solid rgba(92,88,82,.35);border-radius:3px;cursor:pointer}
  #speed button{width:36px}
  #speed button:hover,#filebtns button:hover{border-color:var(--nong)}
  #speed button.on{background:var(--zhu);border-color:var(--zhu);color:var(--paper)}
  #filebtns{display:flex;gap:4px;margin-left:8px}

  /* ---- 左：建造 ---- */
  #left{position:absolute;left:0;top:56px;bottom:120px;width:212px;display:flex;flex-direction:column;
    padding:8px;z-index:9;pointer-events:none}
  #bpanel{background:rgba(244,239,227,.92);border:1px solid rgba(92,88,82,.3);border-radius:6px;
    padding:8px;display:flex;flex-direction:column;gap:6px;pointer-events:auto;
    box-shadow:0 4px 20px rgba(31,29,26,.08);max-height:100%}
  #bpanel h2{font-size:15px;letter-spacing:3px;color:var(--jiao)}
  #btabs{display:flex;flex-wrap:wrap;gap:4px}
  #btabs button{font-family:inherit;font-size:12px;padding:2px 8px;border:1px solid rgba(92,88,82,.3);
    border-radius:3px;background:transparent;color:var(--zhong);cursor:pointer}
  #btabs button.on{background:var(--zhong);color:var(--paper)}
  #bgrid{overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding-right:2px}
  .bcard{font-family:inherit;text-align:left;background:rgba(255,255,255,.5);border:1px solid rgba(92,88,82,.28);
    border-radius:4px;padding:5px 7px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .bcard b{font-size:13.5px;color:var(--jiao);font-weight:normal}
  .bcard span{font-size:11px;color:var(--dan)}
  .bcard:hover{border-color:var(--zhong)}
  .bcard.on{border-color:var(--zhu);box-shadow:0 0 0 1px var(--zhu)}
  .bcard.locked{opacity:.4;cursor:not-allowed}
  #bhint{font-size:11.5px;color:var(--dan);line-height:1.5}

  /* ---- 右：选中 ---- */
  #right{position:absolute;right:0;top:56px;width:220px;padding:8px;z-index:9}
  #selinfo{background:rgba(244,239,227,.92);border:1px solid rgba(92,88,82,.3);border-radius:6px;
    padding:10px;box-shadow:0 4px 20px rgba(31,29,26,.08)}
  #selinfo .hint{font-size:12px;color:var(--dan);letter-spacing:1px}
  #selinfo h3{font-size:16px;color:var(--jiao);letter-spacing:1px;margin-bottom:4px}
  #selinfo h3 small{font-size:11px;color:var(--zhu);margin-left:6px}
  #selinfo .sub{font-size:12px;color:var(--zhong);margin:3px 0;letter-spacing:.5px}
  .bar{display:flex;align-items:center;gap:6px;margin:4px 0}
  .bar em{font-style:normal;font-size:11px;color:var(--dan);width:26px}
  .bar i{flex:1;height:7px;background:rgba(92,88,82,.15);border-radius:3px;overflow:hidden}
  .bar b{display:block;height:100%;background:var(--zhong);border-radius:3px}
  .bar b.bad{background:var(--zhu)}
  .bar u{text-decoration:none;font-size:10.5px;color:var(--dan);width:22px;text-align:right}
  .act{margin-top:8px;font-family:inherit;font-size:12.5px;padding:4px 10px;
    border:1px solid var(--zhu);color:var(--zhu);background:transparent;border-radius:3px;cursor:pointer}
  .act:hover{background:var(--zhu);color:var(--paper)}
  .act.small{margin-top:2px;margin-right:4px;font-size:11.5px;padding:2px 7px;border-color:rgba(163,59,46,.5)}
  .act.dim{opacity:.4}
  .recipe{border-top:1px dashed rgba(92,88,82,.25);padding:6px 0 2px}
  .recipe .rline{display:flex;justify-content:space-between;align-items:baseline}
  .recipe b{font-size:13.5px;color:var(--jiao);font-weight:normal}
  .recipe .rline span{font-size:11px;color:var(--dan)}
  .recipe .rdesc{font-size:11.5px;color:var(--zhong);margin:2px 0 3px}
  .qtag{display:inline-block;font-size:11.5px;color:var(--hua);border:1px solid rgba(61,90,128,.4);
    border-radius:3px;padding:1px 6px;margin:2px 3px 0 0}
  .qtag b{cursor:pointer;color:var(--zhu);font-weight:normal;margin-left:3px}
  .artrow{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
  .seedhead{color:var(--hua);font-size:12px;margin-top:4px}
  #qte-c{display:block;margin:10px auto;background:var(--paper);border:1px solid rgba(92,88,82,.3)}
  .qte-tip{text-align:center;font-size:12.5px;color:var(--zhong);letter-spacing:1px;margin-bottom:8px}
  u.good{text-decoration:none;color:#3d7a52}
  u.bad{text-decoration:none;color:var(--zhu)}

  /* ---- 日志 ---- */
  #logbox{position:absolute;left:8px;bottom:44px;width:340px;max-height:190px;overflow:hidden;
    display:flex;flex-direction:column-reverse;z-index:8;pointer-events:none}
  #log div{font-size:12px;color:var(--zhong);background:rgba(244,239,227,.82);margin-top:3px;
    padding:2px 8px;border-radius:3px;letter-spacing:.5px}
  #log b{color:var(--dan);font-weight:normal;font-size:11px;margin-right:4px}

  /* ---- 提示浮层 ---- */
  #toasts{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:20;
    display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .toast{background:rgba(31,29,26,.88);color:var(--paper);font-size:14px;letter-spacing:2px;
    padding:8px 22px;border-radius:4px;border-left:3px solid var(--zhu);
    transition:opacity .6s;animation:drop .3s}
  @keyframes drop{from{transform:translateY(-8px);opacity:0}}

  /* ---- 风水视图按钮 ---- */
  #btn-feng{height:30px;font-family:inherit;font-size:13px;color:var(--zhong);cursor:pointer;
    background:rgba(244,239,227,.9);border:1px solid rgba(92,88,82,.35);border-radius:3px;padding:0 10px;margin-left:6px}
  #btn-feng.on{background:var(--hua);border-color:var(--hua);color:var(--paper)}

  /* ---- 择典弹窗 ---- */
  #modal{position:absolute;inset:0;background:rgba(31,29,26,.45);z-index:30;
    display:flex;align-items:center;justify-content:center}
  .mbox{background:var(--paper);border:2px solid var(--zhong);border-radius:8px;padding:18px 20px;
    width:560px;max-height:82vh;overflow-y:auto;box-shadow:0 16px 60px rgba(0,0,0,.4)}
  .mbox h3{font-size:18px;color:var(--jiao);letter-spacing:2px;margin-bottom:4px}
  .mbox h3 small{font-size:12px;color:var(--dan);margin-left:8px;letter-spacing:1px}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .scard{font-family:inherit;text-align:left;background:rgba(255,255,255,.55);border:1px solid rgba(92,88,82,.3);
    border-radius:5px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .scard:hover{border-color:var(--zhu);box-shadow:0 0 0 1px var(--zhu)}
  .scard b{font-size:15px;color:var(--jiao);font-weight:normal}
  .scard span{font-size:11.5px;color:var(--zhong)}
  .scard u{text-decoration:none}
  .scard u.good{color:#3d7a52}
  .scard u.bad{color:var(--zhu)}

  /* ---- 底栏 ---- */
  #bottombar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;
    padding:7px 14px;font-size:12.5px;color:var(--dan);letter-spacing:1px;
    background:linear-gradient(transparent,rgba(244,239,227,.92) 45%);pointer-events:none;z-index:10}
  #bottombar .dot{color:var(--qing)}
  #stats{margin-left:auto;color:var(--dan)}
</style>
</head>
<body>
<div id="stage"></div>

<div id="topbar">
  <div class="seal">云隐</div>
  <div class="title">云隐仙踪<small>P1 · 荒山立足</small></div>
  <div id="res"></div>
  <div id="date">—</div>
  <div id="speed">
    <button data-s="0" title="暂停">⏸</button>
    <button data-s="1" class="on" title="一倍速">▶</button>
    <button data-s="2" title="二倍速">▶▶</button>
    <button data-s="4" title="四倍速">▶▶▶</button>
  </div>
  <div id="filebtns">
    <select id="slot" title="档位"><option value="1">档一</option><option value="2">档二</option><option value="3">档三</option></select>
    <button id="btn-save">存</button>
    <button id="btn-load">读</button>
    <button id="btn-new">新局</button>
  </div>
  <button id="btn-feng" style="display:none" title="观星台·风水视图">☰ 风水</button>
</div>

<div id="left">
  <div id="bpanel">
    <h2>营 造</h2>
    <div id="btabs"></div>
    <div id="bgrid"></div>
    <div id="bhint">选择建筑后在地图上放置</div>
  </div>
</div>

<div id="right">
  <div id="selinfo"><div class="hint">点选弟子 / 建筑 / 地块</div></div>
</div>

<div id="logbox"><div id="log"></div></div>
<div id="toasts"></div>

<div id="bottombar">
  <span>左键选择/放置</span><span class="dot">·</span>
  <span>拖拽平移</span><span class="dot">·</span>
  <span>滚轮缩放</span><span class="dot">·</span>
  <span>右键/ESC 取消放置</span><span class="dot">·</span>
  <span>控制台 <b>__G</b></span>
  <span id="stats"></span>
</div>

<script src="js/core/boot.js"></script>
<script src="js/core/rng.js"></script>
<script src="js/core/bus.js"></script>
<script src="js/core/tick.js"></script>
<script src="js/render/ink/palette.js"></script>
<script src="js/render/ink/paper.js"></script>
<script src="js/render/ink/brush.js"></script>
<script src="js/sim/time.js"></script>
<script src="js/sim/map.js"></script>
<script src="js/db/items.js"></script>
<script src="js/db/buildings.js"></script>
<script src="js/db/realms.js"></script>
<script src="js/db/scriptures.js"></script>
<script src="js/db/recipes.js"></script>
<script src="js/db/solar.js"></script>
<script src="js/sim/path.js"></script>
<script src="js/sim/inventory.js"></script>
<script src="js/sim/build.js"></script>
<script src="js/sim/fengshui.js"></script>
<script src="js/sim/formation.js"></script>
<script src="js/sim/cultivate.js"></script>
<script src="js/sim/buff.js"></script>
<script src="js/sim/craft.js"></script>
<script src="js/sim/spiritplant.js"></script>
<script src="js/sim/farm.js"></script>
<script src="js/sim/disciple.js"></script>
<script src="js/sim/work.js"></script>
<script src="js/sim/season.js"></script>
<script src="js/sim/game.js"></script>
<script src="js/render/canvas.js"></script>
<script src="js/render/scene.js"></script>
<script src="js/render/dyn.js"></script>
<script src="js/core/save.js"></script>
<script src="js/core/debug.js"></script>
<script src="test/tests.js"></script>
<script src="js/ui/qte.js"></script>
<script src="js/ui/hud.js"></script>
<script>
(function (X) {
  X.Paper.bake(7);
  X.Brush.bake();
  X.Map.generate();
  X.Canvas.init(document.getElementById('stage'));
  X.Scene.render();
  X.Game.init();
  X.HUD.init();

  // 日期
  const dateEl = document.getElementById('date');
  const refresh = () => { dateEl.textContent = X.Time.dateString(); };
  X.Bus.on('time:shichen', refresh);
  refresh();

  // 速度
  const btns = [...document.querySelectorAll('#speed button')];
  const setBtn = s => btns.forEach(b => b.classList.toggle('on', +b.dataset.s === s));
  btns.forEach(b => b.addEventListener('click', () => {
    const s = +b.dataset.s;
    if (s === 0) { X.Tick.stop(); setBtn(0); }
    else { X.Tick.setSpeed(s); X.Tick.start(); setBtn(s); }
  }));
  window.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); document.querySelector('#speed button[data-s="0"]').classList.contains('on')
      ? document.querySelector('#speed button[data-s="1"]').click()
      : document.querySelector('#speed button[data-s="0"]').click(); }
  });

  // 帧率与每日自动存档
  const statsEl = document.getElementById('stats');
  setInterval(() => {
    const s = X.Canvas.stats();
    statsEl.textContent = `${s.fps}fps · ${s.zoom}×`;
  }, 600);
  X.Bus.on('time:day', () => { try { X.Save.save('auto'); } catch (e) {} });

  X.Tick.start();
  if (window.__errs && __errs.length) X.log('启动期错误:', __errs);
  X.log('P1 荒山立足就绪', { version: X.VERSION });
})(XIANG);
</script>
</body>
</html>
