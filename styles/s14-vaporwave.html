<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>样张14 · 蒸汽波</title>
<style>
  body{margin:0;background:#0e0a1a;height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Kaiti SC",serif}
  canvas{max-width:96vw;max-height:92vh;box-shadow:0 0 60px rgba(255,90,200,.2)}
  .tag{position:fixed;top:10px;left:16px;color:#9df3ff;font-size:15px;letter-spacing:3px}
  .cap{position:fixed;bottom:8px;left:16px;color:#7a6a9a;font-size:12px}
</style>
</head>
<body>
<canvas id="c" width="960" height="600"></canvas>
<div class="tag">14 · 蒸汽波</div>
<div class="cap">紫粉渐变 + 条纹落日 + 网格地平线 —— 潮流梗感，宣传图吸睛</div>
<script>
const g = document.getElementById('c').getContext('2d');

// 紫粉渐变天
const sky = g.createLinearGradient(0, 0, 0, 420);
sky.addColorStop(0, '#1a0f3a'); sky.addColorStop(0.5, '#6a2a8a'); sky.addColorStop(1, '#e860a0');
g.fillStyle = sky; g.fillRect(0, 0, 960, 420);

// 星
g.fillStyle = '#fff';
for (let i = 0; i < 40; i++) {
  const x = (i * 211) % 960, y = (i * 97) % 260;
  g.globalAlpha = 0.3 + (i % 5) * 0.14;
  g.fillRect(x, y, 2, 2);
}
g.globalAlpha = 1;

// 条纹落日
const sunY = 300, sunR = 130;
const sun = g.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
sun.addColorStop(0, '#ffd23e'); sun.addColorStop(0.5, '#ff8a5c'); sun.addColorStop(1, '#ff4e8a');
g.save();
g.beginPath(); g.arc(480, sunY, sunR, 0, 7); g.clip();
g.fillStyle = sun; g.fillRect(480 - sunR, sunY - sunR, sunR * 2, sunR * 2);
// 横切空条
g.fillStyle = '#1a0f3a';
for (let i = 0; i < 6; i++) {
  const y = sunY + 18 + i * 17, h = 3 + i * 2.4;
  g.fillRect(480 - sunR, y, sunR * 2, h);
}
g.restore();
// 日晕
g.strokeStyle = 'rgba(255,180,120,.5)'; g.lineWidth = 3;
g.beginPath(); g.arc(480, sunY, sunR + 18, 0, 7); g.stroke();

// 剪影棕榈→替换成"仙山剪影"（左右对称小山 + 塔）
g.fillStyle = '#160a2a';
g.beginPath();
g.moveTo(0, 420); g.lineTo(0, 300);
g.quadraticCurveTo(80, 210, 150, 300); g.quadraticCurveTo(200, 360, 280, 320); g.lineTo(280, 420);
g.closePath(); g.fill();
g.beginPath();
g.moveTo(960, 420); g.lineTo(960, 280);
g.quadraticCurveTo(880, 190, 800, 300); g.quadraticCurveTo(760, 350, 690, 320); g.lineTo(690, 420);
g.closePath(); g.fill();
// 左剪影塔
g.fillStyle = '#160a2a';
g.fillRect(120, 180, 26, 150);
g.beginPath(); g.moveTo(105, 182); g.lineTo(133, 130); g.lineTo(161, 182); g.closePath(); g.fill();
g.fillRect(113, 340, 8, 26); g.fillRect(146, 340, 8, 26);

// 网格地面
g.fillStyle = '#0d0620'; g.fillRect(0, 420, 960, 180);
g.strokeStyle = '#ff4ea0'; g.lineWidth = 1.4; g.globalAlpha = .8;
for (let i = 0; i <= 12; i++) {
  const t = i / 12;
  g.beginPath(); g.moveTo(0, 420 + t * t * 180); g.lineTo(960, 420 + t * t * 180); g.stroke();
}
for (let i = -9; i <= 9; i++) {
  g.beginPath(); g.moveTo(480 + i * 36, 420); g.lineTo(480 + i * 210, 610); g.stroke();
}
// 地平线辉光
const glow = g.createLinearGradient(0, 410, 0, 440);
glow.addColorStop(0, 'rgba(255,120,200,0)'); glow.addColorStop(0.5, 'rgba(255,150,210,.8)'); glow.addColorStop(1, 'rgba(255,120,200,0)');
g.fillStyle = glow; g.fillRect(0, 410, 960, 30);
g.globalAlpha = 1;

// 人物：霓虹轮廓打坐修士（居中日前）
function person(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.strokeStyle = '#8cf5ff'; g.lineWidth = 3; g.lineCap = 'round';
  g.shadowColor = '#8cf5ff'; g.shadowBlur = 18;
  // 打坐剪影线
  g.beginPath();
  g.moveTo(-40, 0); g.quadraticCurveTo(-20, 14, 0, 12); g.quadraticCurveTo(20, 14, 40, 0);
  g.stroke();
  g.beginPath();
  g.moveTo(-30, 0); g.quadraticCurveTo(-38, -46, 0, -58); g.quadraticCurveTo(38, -46, 30, 0);
  g.stroke();
  g.beginPath(); g.arc(0, -72, 13, 0, 7); g.stroke();
  g.beginPath(); g.moveTo(9, -84); g.lineTo(12, -95); g.stroke();
  // 合十手
  g.beginPath(); g.moveTo(-9, -38); g.lineTo(0, -28); g.lineTo(9, -38); g.stroke();
  // 面部镜面墨镜(蒸汽波标志)
  g.strokeStyle = '#ff5ad0'; g.shadowColor = '#ff5ad0';
  g.beginPath(); g.roundRect(-9, -76, 18, 6, 2); g.stroke();
  g.beginPath(); g.moveTo(-13, -75); g.lineTo(-9, -72); g.stroke();
  g.beginPath(); g.moveTo(13, -75); g.lineTo(9, -72); g.stroke();
  g.restore();
  g.shadowBlur = 0;
}
person(480, 480, 1.9);

// 霓虹道具
function neon(x, y, c, fn) {
  g.strokeStyle = c; g.shadowColor = c; g.shadowBlur = 14; g.lineWidth = 2.6;
  fn(x, y);
  g.shadowBlur = 0;
}
neon(160, 500, '#8cf5ff', (x, y) => { g.beginPath(); g.arc(x, y, 16, 0, 7); g.stroke(); g.beginPath(); g.arc(x, y, 6, 0, 7); g.stroke(); });
neon(820, 500, '#ff5ad0', (x, y) => { g.beginPath(); g.moveTo(x - 30, y); g.lineTo(x + 30, y); g.stroke(); g.beginPath(); g.moveTo(x + 22, y - 10); g.lineTo(x + 22, y + 10); g.stroke(); });
neon(890, 460, '#ffd23e', (x, y) => { g.beginPath(); g.arc(x, y + 8, 12, 0, 7); g.stroke(); g.beginPath(); g.arc(x, y - 8, 7, 0, 7); g.stroke(); });

// 铬金标题字（渐变填充模拟）
const tt = g.createLinearGradient(0, 40, 0, 100);
tt.addColorStop(0, '#9df3ff'); tt.addColorStop(0.5, '#fff'); tt.addColorStop(1, '#ff8ad0');
g.font = 'bold 44px "Kaiti SC",serif';
g.fillStyle = tt; g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1;
g.fillText('修 仙 蒸 汽 波', 60, 88);
</script>
</body>
</html>
